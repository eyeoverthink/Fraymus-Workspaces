import Groq from "groq-sdk";
const groq = new Groq();

export async function generatePrompt(product: string) {
  const system = \`
You are a conversion-focused art director.
Goal: generate FLUX prompts that sell.
Rules:
- Always include: material, lighting, lens
- No humans, no text, product-hero only
- Output JSON: { prompt, negative_prompt, style }
  \`;

  const completion = await groq.chat.completions.create({
    model: "llama-3.1-70b-versatile",
    messages: [
      { role: "system", content: system },
      { role: "user", content: \`Product: \${product}\` }
    ],
    response_format: { type: "json_object" },
    temperature: 0.8
  });

  return JSON.parse(completion.choices[0].message.content);
}`},{id:"flux",num:"02",title:"FLUX schnell",subtitle:"FREE • Apache 2.0",label:"TEXT → IMAGE 1024²",color:"from-zinc-100/10 to-zinc-800/20",accent:"text-zinc-200",border:"border-zinc-700/60",code:`// 02 — FLUX SCHNELL: FREE Apache 2.0
// 28 steps, 1024x1024, ~0.9s on L40S

import { fal } from "@fal-ai/client";

export async function textToImage(prompt: string) {
  const result = await fal.subscribe("fal-ai/flux/schnell", {
    input: {
      prompt,
      image_size: "square_hd",
      num_inference_steps: 28,
      guidance_scale: 3.5,
      enable_safety_checker: false
    },
    logs: true
  });

  // result.data.images[0].url -> 1024x1024 PNG
  return result.data.images[0];
}`},{id:"birefnet",num:"03",title:"BiRefNet Remover",subtitle:"FREE WASM • Replaces Remove.bg",label:"IMAGE → TRANSPARENT PNG",color:"from-indigo-600/20 to-blue-600/20",accent:"text-indigo-300",border:"border-indigo-500/30",isNew:!0,code:`// 03 — NEW: BiRefNet Background Remover
// Runs 100% in browser via WASM • No API cost
// Replaces Remove.bg ($0.20 / image)

import { removeBackground } from "@nodular/birefnet-wasm";

export async function removeBg(imageUrl: string) {
  // Load BiRefNet model (47MB, cached in OPFS)
  const blob = await fetch(imageUrl).then(r => r.blob());

  // Inference ~1.2s on M1, returns RGBA
  const transparentPng = await removeBackground(blob, {
    model: "BiRefNet_general",
    threshold: 0.5,
    feather: 2
  });

  // Returns: { url: blobUrl, mask: ImageData }
  return transparentPng;
}`},{id:"esrgan",num:"04",title:"Real-ESRGAN Upscaler",subtitle:"FREE Sharp • Replaces Magnific",label:"1024 → 4096 • 4x UPSCALE",color:"from-emerald-600/20 to-teal-600/20",accent:"text-emerald-300",border:"border-emerald-500/30",isNew:!0,code:`// 04 — NEW: Real-ESRGAN 4x Upscaler
// WASM + WebGPU, 4x detail, no Magnific needed
// Replaces Magnific.ai ($39/mo)

import { upscale } from "@nodular/realesrgan-wasm";

export async function upscale4x(pngBlob: Blob) {
  // Tile-based upscale to avoid OOM
  const result = await upscale(pngBlob, {
    scale: 4,
    model: "RealESRGAN_x4plus",
    tile: 512,
    denoise: 0.2,
    face_enhance: false // keep product sharp
  });

  // 1024 -> 4096 PNG, alpha preserved
  // ~3.4s on WebGPU, ~12s WASM fallback
  return result; // Blob 4096x4096
}`},{id:"deploy",num:"05",title:"HTML Preview + Deploy",subtitle:"EDGE • POST /api/workflows/:id/run",label:"FINAL OUTPUT + API",color:"from-amber-500/10 to-orange-500/10",accent:"text-amber-200",border:"border-amber-500/20",code:`// 05 — HTML Preview + Deploy

  });
}`}],gu=[{node:"llama",icon:gn,text:'REA: Add "softbox + rim light" to your system prompt — +23% CTR on product cards'},{node:"flux",icon:yt,text:"FLUX: guidance 3.5 + 28 steps = best photoreal tradeoff for commerce"},{node:"birefnet",icon:Ze,text:"NEW: BiRefNet keeps fine hair/fur edges — feather 2px for seamless composites"},{node:"esrgan",icon:Nr,text:"NEW: ESRGAN tile=512 avoids OOM on mobile — denoise 0.2 preserves texture"},{node:"deploy",icon:hn,text:"SHIP: Your workflow is $0.00 per run vs $0.60 with Remove.bg + Magnific"}],W0={llama:["[llama] system prompt loaded (892 tokens)","[llama] generating art direction JSON...",'[llama] → prompt: "minimalist ceramic vase, matte glaze, soft studio lighting, 85mm lens" ✓'],flux:["[flux] prompt dispatched to schnell","[flux] inference step 07/28 • 0.21s","[flux] inference step 21/28 • 0.64s","[flux] → image 1024x1024 ready (1.1s) ✓"],birefnet:["[birefnet] model cached OPFS • 47MB","[birefnet] WASM inference started","[birefnet] mask IoU 0.973 • edge refinement","[birefnet] → transparent PNG + checker ✓"],esrgan:["[esrgan] WebGPU available • using GPU path","[esrgan] tiling 1024→4x (4 tiles)","[esrgan] upscaling tile 4/4 • 4096x4096","[esrgan] → 4K sharp PNG ready (2.9s) ✓"],deploy:["[deploy] composing HTML preview","[deploy] POST /api/workflows/wf_7x9k/run ready","[deploy] cost $0.00 • cached edge ✓"]};function yu(){let[e,t]=fe.useState("birefnet"),[n,r]=fe.useState(!1),[l,i]=fe.useState([]),[o,u]=fe.useState(null),[a,c]=fe.useState(["> nodular ready — click RUN WORKFLOW","> 5 nodes • 2 new • $0 cost stack"]),[v,g]=fe.useState(0),[h,S]=fe.useState(!1),E=fe.useRef(null),z=fe.useRef(null),R=xt.find((m)=>m.id===e),d=gu[v];fe.useEffect(()=>{let m=setInterval(()=>g((k)=>(k+1)%gu.length),3200);return()=>clearInterval(m)},[]),fe.useEffect(()=>{z.current?.scrollIntoView({behavior:"smooth"})},[a]);let s=async()=>{if(n)return;r(!0),i([]),c(["> workflow wf_7x9k started","> stack: groq + flux + birefnet(wasm) + realesrgan(wasm)"])
