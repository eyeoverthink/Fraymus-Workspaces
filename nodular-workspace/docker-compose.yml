services:
  nodular:
    build:
      context: .
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3001"
      DATA_DIR: /data
    volumes:
      - nodular-data:/data
    restart: unless-stopped

volumes:
  nodular-data:
